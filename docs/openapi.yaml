openapi: 3.1.1
info:
  title: Calculadora Spring Boot API
  description: API REST para realizar operaciones aritméticas básicas (+, -, *, /).
  version: 0.0.1-SNAPSHOT
servers:
  - url: http://localhost:8080
    description: Servidor local de desarrollo
paths:
  /calcular:
    post:
      summary: Realizar operación aritmética
      description: Recibe dos números y un operador para realizar la suma, resta, multiplicación o división.
      operationId: calcular
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculadoraRequest'
      responses:
        '200':
          description: Operación realizada con éxito
          content:
            application/json:
              schema:
                type: number
                format: double
                example: 15.0
        '400':
          description: Petición incorrecta (operación inválida o división por cero)
          content:
            text/plain:
              schema:
                type: string
              examples:
                divisionPorCero:
                  summary: Error de división por cero
                  value: "can't divide by zero"
                operacionInvalida:
                  summary: Operador no válido
                  value: "Invalid operation"
        '500':
          description: Error interno en el servidor
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    CalculadoraRequest:
      type: object
      required:
        - operation
        - n1
        - n2
      properties:
        operation:
          type: string
          description: El operador aritmético a aplicar (+, -, *, /).
          enum:
            - "+"
            - "-"
            - "*"
            - "/"
          example: "+"
        n1:
          type: number
          format: double
          description: El primer operando de la operación.
          example: 10.0
        n2:
          type: number
          format: double
          description: El segundo operando de la operación.
          example: 5.0
